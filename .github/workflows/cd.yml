name: CD

on:
  push:
    tags: ['v*']

env:
  REGISTRY:registry.cn-hangzhou.aliyuncs.com
  IMAGE_NAME:openclaw-relay

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push Relay Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./relay-server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-relay:
    needs: build-artifacts
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Alibaba Cloud
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_IP: ${{ vars.DEPLOY_SERVER_IP }}
          SERVER_PORT: ${{ vars.DEPLOY_SERVER_PORT }}
          SERVER_USER: ${{ vars.DEPLOY_SERVER_USER }}
          DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
          VERSION: ${{ env.VERSION }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          echo "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key -p $SERVER_PORT \
            $SERVER_USER@$SERVER_IP << 'ENDSSH'
            set -e

            REGISTRY="$REGISTRY"
            IMAGE_NAME="$IMAGE_NAME"
            VERSION="$VERSION"
            DEVICE_TOKEN="$DEVICE_TOKEN"

            echo "=== Pulling Docker image ==="
            docker pull $REGISTRY/$IMAGE_NAME:$VERSION

            echo "=== Creating config directory ==="
            mkdir -p /opt/openclaw-relay

            echo "=== Creating docker-compose.yml ==="
            cat > /opt/openclaw-relay/docker-compose.yml << 'EOFCOMPOSE'
            version: '3.8'
            services:
              relay:
                image: ${REGISTRY}/${IMAGE_NAME}:${VERSION}
                container_name: openclaw-relay
                restart: unless-stopped
                ports:
                  - "18791:18791"
                environment:
                  - NODE_ENV=production
                  - DEVICE_TOKEN=${DEVICE_TOKEN}
                healthcheck:
                  test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 10s
            EOFCOMPOSE

            echo "=== Stopping existing container ==="
            cd /opt/openclaw-relay
            docker compose down || true

            echo "=== Starting new container ==="
            DEVICE_TOKEN="$DEVICE_TOKEN" docker compose up -d

            echo "=== Waiting for health check ==="
            sleep 10

            echo "=== Container logs ==="
            docker logs openclaw-relay --tail 30

            echo "=== Health check ==="
            curl -s http://localhost:18791/health || echo "Health check failed"

            echo "=== Deployment complete ==="
          ENDSSH

          echo ""
          echo "=== Deployment completed for tag $VERSION ==="
          echo "Server: $SERVER_IP:$SERVER_PORT"
          echo "Relay WebSocket: ws://$SERVER_IP:18791"
